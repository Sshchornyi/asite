<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 4</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f4f4f8;
  }
  h1 { color: #222; }
  a.button {
    margin-top: 20px;
    padding: 12px 24px;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
  }
  a.button:hover { background: #1d4ed8; }
  a.back {
    margin-top: 10px;
    color: #555;
    text-decoration: none;
    font-size: 14px;
  }
</style>
</head>
<body>
  <h1>Page 4</h1>
  <p>You reached this page through Page 3. Page 5 can only be reached from here.</p>
  <a class="button" href="page5.html" onclick="sessionStorage.setItem('cameFromPage4', 'true');">Go to Page 5</a>
  <a class="back" href="page3.html">&larr; Back to Page 3</a>

  <script>
    // Block direct access: require that the visitor came via Page 3's link.
    if (sessionStorage.getItem('cameFromPage3') !== 'true') {
      window.location.replace('page3.html');
    } else {
      // Consume the flag so refreshing or re-entering the URL bar forces going back through Page 3 again.
      sessionStorage.removeItem('cameFromPage3');
    }
  </script>
</body>
</html>
