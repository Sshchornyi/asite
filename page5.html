<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 5</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f4f4f8;
  }
  h1 { color: #222; }
  a.back {
    margin-top: 20px;
    color: #555;
    text-decoration: none;
    font-size: 14px;
  }
</style>
</head>
<body>
  <h1>Page 5</h1>
  <p>You reached this page through Page 4. This is the final page.</p>
  <a class="back" href="page4.html">&larr; Back to Page 4</a>
  <p><a href="https://en.wikipedia.org/wiki/History" target="_blank" rel="noopener">Learn about History on Wikipedia</a></p>

  <script>
    // Block direct access: require that the visitor came via Page 4's link.
    if (sessionStorage.getItem('cameFromPage4') !== 'true') {
      window.location.replace('page4.html');
    } else {
      // Consume the flag so refreshing or re-entering the URL bar forces going back through Page 4 again.
      sessionStorage.removeItem('cameFromPage4');
    }
  </script>
</body>
</html>
